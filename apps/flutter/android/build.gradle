allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
    // AGP 9 enforces AAR compileSdk metadata for library modules as well.
    // Older Flutter plugins hard-code SDK 31/34 while consuming newer AndroidX.
    plugins.withId("com.android.library") {
        androidComponents.finalizeDsl { library ->
            if (library.compileSdk == null || library.compileSdk < 37) {
                library.compileSdk = 37
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
